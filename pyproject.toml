[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-keepalive"
version = "0.1.0"
description = "Keep idle GPUs busy with a synthetic workload, and yield the instant real work shows up"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JungMinseop" }]
keywords = ["gpu", "nvidia", "cuda", "nvml", "utilization", "daemon", "cluster"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "nvidia-ml-py>=12",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The supervisor needs only NVML. The worker needs a CUDA-enabled PyTorch,
# which is too environment-specific to pin here -- install it yourself.
worker = ["torch>=2.0"]

[project.scripts]
gpuidle = "gpu_keepalive.cli:main"
gpu-run = "gpu_keepalive.gpu_run:main"
gpu-keepalive = "gpu_keepalive.supervisor:main"

[project.urls]
Homepage = "https://github.com/cm8908/gpu-keepalive"
Issues = "https://github.com/cm8908/gpu-keepalive/issues"

[tool.setuptools]
packages = ["gpu_keepalive"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
